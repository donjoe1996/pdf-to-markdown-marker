[project]
name = "bt-transcribe"
version = "1.0.0"
description = "Transcribe the scanned Being and Time PDF to Markdown via datalab-to/marker"
requires-python = ">=3.12,<3.14"
dependencies = [
    "marker-pdf>=2.0.0,<3",
    "pymupdf>=1.24",
    "numpy>=1.26",
    # Parallel ranged downloads; the plain hub client stalls at 0 bytes on a
    # throttled link when fetching the ~1.3 GB VLM weights.
    "hf-transfer>=0.1.9",
    # The local GUI. Needs >=1.37 for st.fragment(run_every=...), which lets the
    # progress panel refresh without re-running the whole script.
    "streamlit>=1.37",
    # Optional stage 4 (bt.translate). Already arrives with marker-pdf, which
    # pins it <1; declared anyway so the dependency is visible and survives
    # marker dropping it. No upper bound here -- pinning one would fight
    # marker's. 0.69 is the floor for output_config/stop_details, both of which
    # translate.py uses. Imported inside ClaudeTranslator, not at module scope,
    # so the fast suite never touches it and the pipeline runs with no
    # credentials and no network.
    "anthropic>=0.69",
]

[project.scripts]
bt-transcribe = "bt.run:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Catches undefined names and unused imports statically. Two real bugs here
    # (`re` and `os` used but never imported) compiled cleanly and would only
    # have failed at runtime, on a path that runs once per chunk.
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fast by default. The everyday suite must stay quick enough that nobody is
# tempted to skip it; the slow tests boot Streamlit and analyse real PDFs, so
# they run in CI and on demand (`pytest -m slow`) rather than on every save.
addopts = "-q --strict-markers -ra -m 'not slow'"
markers = [
    "slow: boots Streamlit or reads real PDFs (seconds to a minute, not milliseconds)",
]

[tool.ruff]
target-version = "py312"
# The Colab notebook is excluded on purpose: its cells run in a fixed order and
# imports sit where the narrative needs them, so import-ordering rules are wrong
# there rather than useful.
exclude = [".venv", "output", "uploads", ".claude", "colab"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes (undefined names), I import order, B bugbear,
# UP pyupgrade. F is the one that earns its place; the rest are cheap.
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length: prose in docstrings is deliberately wrapped by hand
    "B008",  # function call in default arg: not a pattern used here
]

[tool.ruff.lint.per-file-ignores]
# Env vars must be set before torch is imported, so these modules deliberately
# place imports after module-level statements.
"bt/transcribe.py" = ["E402"]
"bt/warmup.py" = ["E402"]
"bt/worker.py" = ["E402"]
# Tests reach into private helpers on purpose, to pin behaviour at the seam.
"tests/*" = ["E402"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bt"]
