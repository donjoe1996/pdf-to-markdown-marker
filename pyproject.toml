[project]
name = "bt-transcribe"
version = "1.0.0"
description = "Transcribe the scanned Being and Time PDF to Markdown via datalab-to/marker"
requires-python = ">=3.12,<3.14"
dependencies = [
    "marker-pdf>=2.0.0,<3",
    "pymupdf>=1.24",
    "numpy>=1.26",
    # Parallel ranged downloads; the plain hub client stalls at 0 bytes on a
    # throttled link when fetching the ~1.3 GB VLM weights.
    "hf-transfer>=0.1.9",
]

[project.scripts]
bt-transcribe = "bt.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bt"]
